{% extends "base.html" %}
{% block content %}
<section class="section">
    <div class="section-header">
        <div class="section-eyebrow">Account Recovery</div>
        <h1 class="section-title">Choose New Password</h1>
    </div>
    <form method="post" class="checkout-form" style="max-width:460px;margin:0 auto">
        {% csrf_token %}
        {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
        <div class="form-group">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" required autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">
        </div>
        <button class="btn-checkout" type="submit">Reset Password</button>
    </form>
</section>
{% endblock %}
