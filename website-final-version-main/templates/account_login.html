{% extends "base.html" %}
{% block content %}
<section class="section">
    <div class="section-header">
        <div class="section-eyebrow">Customer Account</div>
        <h1 class="section-title">Login</h1>
    </div>
    <form method="post" class="checkout-form" style="max-width:460px;margin:0 auto">
        {% csrf_token %}
        {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn-checkout" type="submit">Login</button>
        <p style="margin-top:1rem;color:var(--muted)">New customer? <a href="/account/register/">Create an account</a></p>
        <p style="margin-top:.5rem;color:var(--muted)"><a href="/account/password-reset/">Forgot password?</a></p>
    </form>
</section>
{% endblock %}
