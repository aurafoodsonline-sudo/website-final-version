name: Aura Foods Security Gates
on:
  pull_request:
  schedule:
    - cron: "22 3 * * 1"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt
      - run: python scripts/build_release_package.py
      - name: Reject secrets and runtime data in package
        run: |
          python - <<'PY'
          import zipfile
          names = zipfile.ZipFile("outputs/aurafoods_unified_release.zip").namelist()
          forbidden = (".git/", ".venv/", "__pycache__/", ".pyc", ".env", ".db", ".sqlite3", "media/")
          bad = [name for name in names if any(part in name for part in forbidden)]
          if bad:
              raise SystemExit("Forbidden release entries: " + ", ".join(bad[:20]))
          PY
