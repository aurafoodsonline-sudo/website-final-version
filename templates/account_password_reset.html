{% extends "base.html" %}
{% block content %}
<section class="section">
    <div class="section-header">
        <div class="section-eyebrow">Account Recovery</div>
        <h1 class="section-title">Reset Password</h1>
        <p class="section-subtitle">Enter the email on your Aura Foods customer account.</p>
    </div>
    <form method="post" class="checkout-form" style="max-width:460px;margin:0 auto">
        {% csrf_token %}
        {% if success %}<div class="alert-success">{{ success }}</div>{% endif %}
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <button class="btn-checkout" type="submit">Send Reset Link</button>
    </form>
</section>
{% endblock %}
