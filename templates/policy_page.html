{% extends "base.html" %}
{% block content %}
<section class="section policy-page">
    <div class="breadcrumbs">
        <a href="/">Home</a><span>/</span><span>Policies</span><span>/</span><span class="current">{{ page_title }}</span>
    </div>
    <div style="max-width:820px;margin:0 auto">
        <div class="section-eyebrow">Customer Policy</div>
        <h1 class="section-title" style="text-align:left">{{ page_title }}</h1>
        <div style="background:#fff;border:1px solid rgba(10,10,10,0.08);border-radius:8px;padding:1.5rem;line-height:1.75;color:var(--muted)">
            {{ page_content|linebreaks }}
        </div>
    </div>
</section>
{% endblock %}
