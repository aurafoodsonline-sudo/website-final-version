{% extends "base.html" %}
{% block content %}
<section class="section">
    <div class="section-header">
        <div class="section-eyebrow">Customer Account</div>
        <h1 class="section-title">Create Account</h1>
    </div>
    <form method="post" class="checkout-form" style="max-width:520px;margin:0 auto">
        {% csrf_token %}
        {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">
        </div>
        <button class="btn-checkout" type="submit">Create Account</button>
        <p style="margin-top:1rem;color:var(--muted)">Already registered? <a href="/account/login/">Login</a></p>
    </form>
</section>
{% endblock %}
