{% extends "base.html" %}
{% block content %}
<section class="section">
    <div class="section-header">
        <div class="section-eyebrow">Support</div>
        <h1 class="section-title">Customer Support</h1>
        <p class="section-subtitle">Create a support ticket for orders, delivery, returns, refunds, complaints, or wholesale.</p>
    </div>
    <form method="post" class="checkout-form" style="max-width:680px;margin:0 auto">
        {% csrf_token %}
        {% if success %}<div class="alert-success">{{ success }}</div>{% endif %}
        {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
        <div class="form-group"><label for="name">Name</label><input id="name" name="name" required value="{% if user.is_authenticated %}{{ user.get_full_name|default:user.username }}{% endif %}"></div>
        <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required value="{% if user.is_authenticated %}{{ user.email }}{% endif %}"></div>
        <div class="form-group"><label for="phone">Phone</label><input id="phone" name="phone"></div>
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
                <option value="general">General question</option>
                <option value="shipping">Shipping/tracking</option>
                <option value="return">Return request</option>
                <option value="refund">Refund request</option>
                <option value="complaint">Complaint</option>
                <option value="wholesale">Wholesale</option>
            </select>
        </div>
        <div class="form-group"><label for="subject">Subject</label><input id="subject" name="subject" required maxlength="200"></div>
        <div class="form-group"><label for="message">Message</label><textarea id="message" name="message" rows="5" required minlength="10"></textarea></div>
        <button class="btn-checkout" type="submit">Create Ticket</button>
    </form>
</section>
{% endblock %}
